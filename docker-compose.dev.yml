# Dev overlay: mount source code and auto-reload uvicorn on changes.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Rebuild only when requirements.txt or the Dockerfile changes.
services:
  server:
    command: uvicorn fpm.server:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/fpm --reload-dir /app/shared --reload-dir /app/CASAS2
    volumes:
      - grouped-outputs:/app/fpm/outputs
      - ./fpm:/app/fpm
      - ./shared:/app/shared
      - ./CASAS2:/app/CASAS2
      - ./data:/app/data
  client-p01:
    command: uvicorn fpm.client:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/fpm --reload-dir /app/shared --reload-dir /app/CASAS2
